name: Build Multi-Platform Binaries
on:
  push:
    branches: [ main, axle ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsodium-dev mingw-w64 gcc-mingw-w64-x86-64 liblz4-dev libzstd-dev liblzma-dev
      
      - name: Configure MinGW to use POSIX threads
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      
      - name: Setup Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          mv android-ndk-r27c $HOME/android-ndk-r27c
      
      - name: Update Makefile for CI path
        run: sed -i "s|/home/codespace/android-ndk-r27c|$HOME/android-ndk-r27c|g" Makefile
      
      - name: Install libsodium for Linux/Android
        run: make install-libsodium && make build-libzip-linux
      
      - name: Install libsodium for Windows
        run: make install-libsodium-win

      - name: Build compressors for Android
        run: make build-compressors-android && make build-libzip-android
      
      - name: Build compressors for Windows
        run: make build-compressors-win && make build-libzip-win

      - name: Build all distributions
        run: make clean && make dist && mv cfx cfx-linux
      
      - name: Extract version from Version.h
        id: version
        run: |
          VERSION=v$(grep -E '^#define VERSION "' version.h | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version from version.h: $VERSION"
      
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfx-binaries
          path: |
            cfx-linux
            cfx-windows.exe
            cfx-android
          retention-days: 30

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/axle'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: cfx-binaries
          path: ./
      
      - name: Set executable permissions
        run: chmod +x cfx-linux cfx-android
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.version }}
          release_name: "CFETools ${{ needs.build.outputs.version }}"
          prerelease: ${{ github.ref_name != 'main' }}
          body: |
            This release includes freshly built binaries for the following platforms:
            - **Linux** (`cfx-linux`)
            - **Windows** (`cfx-windows.exe`)
            - **Android** (`cfx-android`)
            
            Built from the [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) commit to `${{ github.ref_name }}` using `make dist`.
            Version: ${{ needs.build.outputs.version }}

      - name: Upload Linux binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./cfx-linux
          asset_name: cfx-linux
          asset_content_type: application/octet-stream

      - name: Upload Windows binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./cfx-windows.exe
          asset_name: cfx-windows.exe
          asset_content_type: application/octet-stream

      - name: Upload Android binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./cfx-android
          asset_name: cfx-android
          asset_content_type: application/octet-stream