name: Build Multi-Platform Binaries

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsodium-dev mingw-w64 gcc-mingw-w64-x86-64

      - name: Configure MinGW to use POSIX threads
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Setup Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          mv android-ndk-r27c $HOME/android-ndk-r27c

      - name: Update Makefile for CI path
        run: sed -i "s|/home/codespace/android-ndk-r27c|$HOME/android-ndk-r27c|g" Makefile

      - name: Install libsodium for Linux/Android
        run: make install-libsodium

      - name: Install libsodium for Windows
        run: make install-libsodium-win

      - name: Build all distributions
        run: make clean && make dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfx-dist
          path: dist/
          retention-days: 30

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release directory
        run: |
          mkdir -p release
          cp artifacts/cfx-dist/cfx-linux release/cfx-linux
          cp artifacts/cfx-dist/cfx-windows.exe release/cfx-windows.exe
          cp artifacts/cfx-dist/cfx-android release/cfx-android
          chmod +x release/cfx-linux release/cfx-android

      - name: Create GitHub Release (automatic)
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GIT_TOKEN }}
          automatic_release_tag: "latest"
          prerelease: false
          title: "Multi-Platform Build"
          files: |
            release/cfx-linux
            release/cfx-windows.exe
            release/cfx-android
          body: |
            This release includes freshly built binaries for the following platforms:
            - **Linux** (`cfx-linux`)
            - **Windows** (`cfx-windows.exe`)
            - **Android** (`cfx-android`)
            Built from the latest commit to `main` or `dev` using `make dist`.