name: Build Multi-Platform Binaries

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsodium-dev
      - name: Build Linux binary
        run: make clean && make
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfx-linux
          path: cfx
          retention-days: 30

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 gcc-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Install libsodium for Windows
        run: make install-libsodium-win
      - name: Build Windows binary
        run: make clean && make windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfx-windows
          path: cfx.exe
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          mv android-ndk-r27c $HOME/android-ndk-r27c
      - name: Update Makefile for CI
        run: sed -i "s|/home/codespace/android-ndk-r27c|$HOME/android-ndk-r27c|g" Makefile
      - name: Build libsodium for Android
        run: make install-libsodium
      - name: Build Android binary
        run: make clean && make android
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfx-android
          path: cfx.android
          retention-days: 30

  create-release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release directory
        run: |
          mkdir -p release
          cp artifacts/cfx-linux/cfx release/cfx-linux
          cp artifacts/cfx-windows/cfx.exe release/cfx-windows.exe
          cp artifacts/cfx-android/cfx.android release/cfx-android
          chmod +x release/cfx-linux release/cfx-android

      - name: Zip binaries
        run: |
          cd release
          zip -r dist.zip *

      - name: Create GitHub Release (automatic)
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: "latest"
          prerelease: false
          title: "Multi-Platform Build"
          files: release/dist.zip
          body: |
            This release includes freshly built binaries for the following platforms:

            - **Linux** (`cfx-linux`)
            - **Windows** (`cfx-windows.exe`)
            - **Android** (`cfx-android`)

            Each file is compiled and packaged from the latest commit to `main` or `dev`.
